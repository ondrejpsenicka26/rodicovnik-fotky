# Druhá kontrola lidí na fotkách (scripts/kontrola.py). Spouští se ručně po stažení fotek;
# díky stejné skupině souběhu počká, až doběhne běh „Fotky školek“.
name: Kontrola fotek

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fotky
  cancel-in-progress: false

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Knihovny (CPU)
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q ultralytics pillow
      - name: Kontrola
        run: python3 scripts/kontrola.py
      - name: Uložit výsledek
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add kontrola.json
          git commit -q -m "Kontrola fotek: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1

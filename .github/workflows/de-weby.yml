name: DE – fakta z webů Kit
# Provoz, věk přijetí, počet míst, zaměření, vybavení a kontakt z vlastních webů Kit.
# Spouští se ručně, až existuje de/data/kitas-osm.json.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: de-weby
  cancel-in-progress: false
jobs:
  weby:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            de
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Projít weby
        run: python de/scripts/weby.py
      - name: Uložit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add --sparse de/data/weby.json 2>/dev/null || git add de/data/weby.json
          git commit -m "DE: fakta z webů Kit $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done

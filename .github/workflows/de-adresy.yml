name: DE – adresy v okolí Kit bez adresy
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: de-adresy
  cancel-in-progress: false
jobs:
  adresy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            de
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Najít adresy
        run: python de/scripts/osm_adresy.py
      - name: Uložit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add --sparse de/data/adresy-okoli.json 2>/dev/null || git add de/data/adresy-okoli.json
          git commit -q -m "DE: adresy v okolí Kit $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done

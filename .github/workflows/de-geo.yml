name: DE – geografie (Kreise, mapa, čtvrti měst)
# Hranice a sousedé Kreise z VG250-EW (BKG), SVG mapa a obvody velkých měst z OSM.
# Spouští se ručně, až existuje de/data/kitas-osm.json (čtvrti přiřazuje Kitám).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: de-geo
  cancel-in-progress: false
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests geopandas pyogrio shapely pandas
      - name: Spočítat
        run: python de/scripts/geo.py
      - name: Uložit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add de/data/geo
          git commit -m "DE: geografie $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done

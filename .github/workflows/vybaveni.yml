# Vybavení a služby školek z jejich webů (scripts/vybaveni.py): úryvky textu kolem klíčových slov.
name: Vybavení z webů

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  projdi:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cast: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            vybaveni
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Projít weby
        env:
          CAST: ${{ matrix.cast }}
          CASTI: 6
        run: timeout 165m python3 scripts/vybaveni.py || true
      - name: Uložit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add --sparse vybaveni/cast-${{ matrix.cast }}.json
          git commit -q -m "Vybavení z webů: část ${{ matrix.cast }} ($(date -u +%Y-%m-%dT%H:%MZ))" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
